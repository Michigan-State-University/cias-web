# JavaScript / TypeScript profile for SonarQube Community Edition

sonar.projectKey=cias-web
sonar.projectName=cias-web
sonar.sourceEncoding=UTF-8

# First-party JavaScript only. cypress/, e2e/, docs/, public/, patches/,
# report-template/, container/ and maintenance/ are not analyzed.
sonar.sources=app,server,internals,mjml
sonar.tests=app,internals

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.test.mjs,\
  **/*.test.mts,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/*.spec.mjs,\
  **/*.spec.mts,\
  **/*.stories.ts,\
  **/*.stories.tsx,\
  **/*.stories.js,\
  **/*.stories.jsx,\
  **/*.stories.mdx,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/__fixtures__/**,\
  **/tests/**,\
  **/test/**,\
  **/spec/**,\
  **/e2e/**,\
  **/cypress/**,\
  **/playwright/**,\
  **/*.cy.ts,\
  **/*.cy.js,\
  **/jest.setup.*,\
  **/vitest.setup.*,\
  **/setupTests.*,\
  **/test-utils.*,\
  **/testing-library.*

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/.next/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/.svelte-kit/**,\
  **/.astro/**,\
