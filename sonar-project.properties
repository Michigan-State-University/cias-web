  **/__generated__/**,\
  **/generated/**,\
  **/*.generated.*

# LCOV -- Jest writes this path with --coverage (see jest.config.js).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.stories.*,\
  **/*.cy.*,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/__fixtures__/**,\
  **/tests/**,\
  **/test/**,\
  **/e2e/**,\
  **/cypress/**,\
  **/playwright/**,\
  **/jest.setup.*,\
  **/vitest.setup.*,\
  **/setupTests.*,\
  **/test-utils.*,\
  **/__generated__/**,\
  **/generated/**,\
  **/*.generated.*,\
  **/*.config.*,\
  **/*.d.ts,\
  **/index.ts,\
  **/index.js,\
  **/main.ts,\
  **/main.js,\
  **/server.ts,\
  **/server.js,\
  **/app.ts,\
  **/app.js,\
  server/**,\
  internals/**,\
  mjml/**,\
  app/**/messages.js,\
  app/**/RbGenerated*/**,\
  app/**/Loadable.js,\
  app/global-styles.js

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.scm.provider=git
sonar.scm.forceReloadAll=false
