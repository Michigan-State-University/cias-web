  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/next.config.*,\
  **/nuxt.config.*,\
  **/svelte.config.*,\
  **/astro.config.*,\
  **/babel.config.*,\
  **/nx.json,\
  **/turbo.json,\
  **/lerna.json,\
  **/.env,\
  **/.env.*,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/cypress/screenshots/**,\
  **/cypress/videos/**,\
  **/__generated__/**,\
  **/generated/**,\
  **/graphql.schema.json,\
  **/*.generated.ts,\
  **/*.generated.js

sonar.cpd.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/*.stories.*,\
  **/*.cy.*,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/__fixtures__/**,\
