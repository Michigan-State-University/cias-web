  **/.storybook/**,\
  **/.idea/**,\
  **/.vscode/**,\
  **/*.d.ts,\
  **/*.d.mts,\
  **/*.d.cts,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js,\
  **/*.chunk.js,\
  **/*.map,\
  **/*.snap,\
  **/pnpm-lock.yaml,\
  **/yarn.lock,\
  **/package-lock.json,\
  **/bun.lockb,\
  **/deno.lock,\
  **/shrinkwrap.json,\
  **/tsconfig.json,\
  **/tsconfig.*.json,\
  **/jsconfig.json,\
  **/.eslintrc.*,\
  **/.prettierrc.*,\
  **/jest.config.*,\
  **/vitest.config.*,\
  **/vite.config.*,\
  **/webpack.config.*,\
