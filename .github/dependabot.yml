# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Let new releases age before they are proposed; majors wait longer for follow-up fixes.
    # Applies to version updates only, security updates are never delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Minor and patch bumps arrive as one PR per dependency type; majors stay individual PRs.
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These releases ship untranspiled ES2022 class static blocks into the eagerly loaded
      # npm.formatjs chunk, which blanks the app on iOS < 16.4 / Chrome < 94 / Firefox < 93.
      # Remove once node_modules/@formatjs is transpiled to the app's floor, or that floor is accepted.
      - dependency-name: "@formatjs/intl-relativetimeformat"
        versions: [">=12.3.2"]
      - dependency-name: "@formatjs/intl-pluralrules"
        versions: [">=6.3.2"]

  # Base images are pinned by digest, so this also brings rebuilt images with OS fixes.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node majors move with .nvmrc and the app's engines, not on their own.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # HTD's shared workflow; it isn't changed in this repo.
    exclude-paths:
      - ".github/workflows/code-quality.yml"
    groups:
      github-actions:
        patterns: ["*"]
