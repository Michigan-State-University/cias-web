name: E2E Tests

on: push

# A newer push to the same branch stops the older run. Left running, its shards
# keep driving the shared staging accounts underneath the newer run's shards.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://cias-api-staging.herokuapp.com
  WEBSOCKET_URL: wss://cias-api-staging.herokuapp.com/cable
  WEB_URL: http://localhost:4200
  # One shard per admin account in the pool. The API rotates the access token on
  # every request, so two shards must never drive the same account.
  SHARD_COUNT: 5

jobs:
  build:
    name: Build app for E2E
    # Runs triggered by Dependabot get no repository secrets, so the admin
    # sign-in can only fail. Skipping here skips the shards that depend on it.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Built once and shared with every shard — the shards only serve it
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: build/
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every run of this workflow shares the same five staging admin accounts, and
    # the API rotates an account's token on each request, so two runs on one
    # account log each other out. Only one job per account at a time: a run from
    # another branch waits for the account instead of colliding with it.
    # (GitHub keeps one pending job per group; a third run queuing for the same
    # account replaces the one already waiting.)
    concurrency:
      group: e2e-staging-account-${{ matrix.account }}
      cancel-in-progress: false

    strategy:
      # one shard failing must not cancel the others, or a single flake hides
      # every other result
      fail-fast: false
      matrix:
        # `account` is spelled out rather than derived from `shard`: GitHub
        # expressions have no arithmetic, so `${{ matrix.shard - 1 }}` is a
        # workflow syntax error
        include:
          - shard: 1
            account: 0
          - shard: 2
            account: 1
          - shard: 3
            account: 2
          - shard: 4
            account: 3
          - shard: 5
            account: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit chromium firefox

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit chromium firefox

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: build/

      # Each shard signs in as exactly one admin account — its own — so the
      # shards cannot rotate each other's tokens out from under them.
      - name: Run Playwright tests
        run: npx playwright test --project=webkit --shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }} --workers=1 --reporter=blob,list
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_ACCOUNT_OFFSET: ${{ matrix.account }}
          E2E_ACCOUNTS_NEEDED: 1
          E2E_ADMIN_EMAIL_PATTERN: ${{ vars.E2E_ADMIN_EMAIL_PATTERN }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VERIFICATION_CODE: ${{ secrets.E2E_VERIFICATION_CODE }}
          E2E_WORKER_COUNT: ${{ vars.E2E_WORKER_COUNT }}
          E2E_AUTH_SETUP_DELAY_MS: ${{ vars.E2E_AUTH_SETUP_DELAY_MS }}
          ADDITIONAL_ORIGIN_SECURE_TOKEN: ${{ secrets.ADDITIONAL_ORIGIN_SECURE_TOKEN }}

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  merge-reports:
    name: Merge E2E reports
    if: always() && github.actor != 'dependabot[bot]'
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
