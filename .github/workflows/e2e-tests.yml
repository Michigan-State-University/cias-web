name: E2E Tests

# Branch pushes only: a tag points at a commit its branch push already tested.
on:
  push:
    branches: ['**']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each shard starts its own cias-api with a fresh database, so shards share no
# server, accounts or data.
env:
  API_URL: http://localhost:3000
  WEBSOCKET_URL: ws://localhost:3000/cable
  WEB_URL: http://localhost:4200
  SHARD_COUNT: 8

jobs:
  build:
    name: Build app for E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # node_modules as npm ci leaves it (patches applied); a hit skips npm ci. All jobs
      # run on ubuntu-22.04, so native modules in the cache match the runner.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-ubuntu-22.04-node22-${{ hashFiles('package-lock.json', 'patches/**', '.npmrc') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-build
          path: build/
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests (shard ${{ matrix.shard }})
    needs: build
    # Same image as cias-api's CI, whose setup the API steps follow
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:13.0-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # All shards must pass; tests only fail after their CI retries, so flakes don't trigger this
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      RAILS_ENV: development
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      APP_HOSTNAME: http://localhost:3000
      # One admin per shard is enough: no other shard uses this API.
      E2E_WORKER_COUNT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Random per job, so the seeded user's credentials can't be reused anywhere else.
      - name: Generate E2E credentials
        run: |
          password="Aa1!$(openssl rand -hex 12)"
          {
            echo "E2E_PASSWORD=$password"
            echo "E2E_ADMIN_PASSWORD=$password"
            echo "E2E_VERIFICATION_CODE=$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      # The API branch of the same name for test and master, and for any other branch
      # that has commits dev doesn't (a paired feature branch, not an old merged one).
      # Otherwise dev.
      - name: Pick the API branch
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=dev
          case "$GITHUB_REF_NAME" in
            test|master) ref=$GITHUB_REF_NAME ;;
            *)
              if ahead=$(gh api "repos/Michigan-State-University/cias-api/compare/dev...$GITHUB_REF_NAME" --jq .ahead_by 2>/dev/null) &&
                [ "$ahead" -gt 0 ]; then
                ref=$GITHUB_REF_NAME
              fi
              ;;
          esac
          echo "API branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Michigan-State-University/cias-api
          ref: ${{ steps.api.outputs.ref }}
          path: cias-api
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          working-directory: cias-api
          bundler-cache: true

      # db:prepare would also run db/seeds.rb, which this doesn't need.
      # Interventions require a language, and a schema-only database has none. With
      # no TTS voice, saving narrator text doesn't call Google.
      - name: Set up the API database
        working-directory: cias-api
        run: |
          cp .env.template .env
          cp config/database.docker.yml config/database.yml
          mkdir -p tmp
          ruby -rsecurerandom -e 'File.write("tmp/local_secret.txt", SecureRandom.hex(64))'
          bin/rails db:create db:schema:load db:seed:e2e
          bin/rails runner 'GoogleLanguage.find_or_create_by!(language_code: "en") { |l| l.language_name = "English" }'

      - name: Start the API
        working-directory: cias-api
        run: |
          nohup bundle exec puma -C config/puma.rb > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup bundle exec sidekiq -C config/sidekiq.yml > "$RUNNER_TEMP/sidekiq.log" 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-ubuntu-22.04-node22-${{ hashFiles('package-lock.json', 'patches/**', '.npmrc') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The tests run in WebKit; the sign-in setup project uses Playwright's default, Chromium.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-build
          path: build/

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/v1/auth/ping" || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "API is up (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API didn't start within 2 minutes"
          tail -n 100 "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=webkit --shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }} --workers=1 --reporter=blob,list
        env:
          E2E_BASE_URL: http://localhost:4200

      - name: Upload blob report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload traces and screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Upload API logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: api-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/sidekiq.log
            cias-api/log/development.log
          retention-days: 7

  merge-reports:
    name: Merge E2E reports
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: node-modules-ubuntu-22.04-node22-${{ hashFiles('package-lock.json', 'patches/**', '.npmrc') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
