name: Scan master

# Builds master from scratch every Monday, and on manual runs, and scans it for
# vulnerabilities that have a fix: npm packages, Node and Debian packages fixed
# since master was last built, i.e. whether a patch release is due. It can't tell
# whether the image production runs lacks them: that was built at its release.
# Schedules only run from the default branch (dev), so the job checks out master.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scan-master
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan a fresh build of master
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No build args: the bundle gets empty URLs, which doesn't matter for a scan. No
      # cache: a cached apt-get upgrade layer would hide newer Debian fixes.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          no-cache: true
          tags: cias-web:scan

      # Same scanner pin as build-check.yml, which says why. A finding fails the job;
      # GitHub then notifies whoever last changed the cron line.
      - name: Scan the image for fixable vulnerabilities
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          status=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 cias-web:scan > trivy.txt || status=$?
          {
            echo "## Fixable HIGH/CRITICAL vulnerabilities in master"
            echo '```'
            cat trivy.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
